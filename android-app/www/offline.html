<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abdi Nono Model Primary School</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #083c2b;
        color: #f6d98a;
        font-family: "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .seal {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        margin: 0 auto 16px;
        background:
          radial-gradient(circle at center, #083c2b 58%, transparent 59%),
          radial-gradient(circle at center, #e2b34d 70%, transparent 71%),
          #083c2b;
        box-shadow: 0 0 0 8px #e2b34d;
        display: grid;
        place-items: center;
        color: white;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      h1 { color: white; font-size: 1.4rem; margin: 0 0 8px; }
      p { margin: 0 0 16px; line-height: 1.45; }
      button {
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        background: #e2b34d;
        color: #083c2b;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="seal">ANMPS</div>
      <h1>Abdi Nono Model Primary School</h1>
      <p>The school site is not reachable. Check the connection, then try again. Saved report pages open when the network returns.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
